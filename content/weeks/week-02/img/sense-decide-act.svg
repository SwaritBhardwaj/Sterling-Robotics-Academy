<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Georgia, 'Times New Roman', serif" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>The sense, decide, act loop on the Tumbller</title>
  <!-- highlighter behind DECIDE -->
  <path d="M318 72 C360 66 410 70 446 68" stroke="#FFE14D" stroke-width="26" opacity=".85"/>
  <!-- boxes, drawn a little unevenly -->
  <g stroke="#26221D" stroke-width="2.2">
    <path d="M42 46 C110 42 170 44 214 47 C218 90 217 140 213 176 C150 179 95 178 44 175 C40 130 41 88 42 46 Z"/>
    <path d="M292 44 C360 41 420 43 470 46 C473 92 472 140 468 177 C410 180 350 179 294 176 C289 130 290 86 292 44 Z"/>
    <path d="M546 47 C610 43 668 45 716 48 C719 92 718 139 714 175 C660 178 600 178 548 175 C543 131 544 89 546 47 Z"/>
  </g>
  <!-- arrows -->
  <g stroke="#26221D" stroke-width="2.2">
    <path d="M222 110 C245 106 262 108 282 110"/><path d="M272 101 L283 110 L271 119"/>
    <path d="M478 110 C500 107 518 108 536 110"/><path d="M526 101 L537 110 L525 119"/>
    <path d="M630 186 C628 250 560 276 380 278 C210 279 132 252 128 188"/><path d="M119 199 L128 186 L139 198"/>
  </g>
  <g fill="#26221D" stroke="none">
    <text x="128" y="84" text-anchor="middle" font-size="25" letter-spacing="2">SENSE</text>
    <text x="128" y="118" text-anchor="middle" font-size="17" font-style="italic" fill="#625B50">motion sensor</text>
    <text x="128" y="142" text-anchor="middle" font-size="17" font-style="italic" fill="#625B50">ultrasonic</text>
    <text x="381" y="84" text-anchor="middle" font-size="25" letter-spacing="2">DECIDE</text>
    <text x="381" y="118" text-anchor="middle" font-size="17" font-style="italic" fill="#625B50">control board</text>
    <text x="381" y="142" text-anchor="middle" font-size="17" font-style="italic" fill="#625B50">your code runs here</text>
    <text x="631" y="84" text-anchor="middle" font-size="25" letter-spacing="2">ACT</text>
    <text x="631" y="118" text-anchor="middle" font-size="17" font-style="italic" fill="#625B50">motor driver</text>
    <text x="631" y="142" text-anchor="middle" font-size="17" font-style="italic" fill="#625B50">motors + wheels</text>
    <text x="380" y="306" text-anchor="middle" font-size="18" font-style="italic" fill="#625B50">the robot moves, so what the sensor feels changes. Round and round, hundreds of times a second.</text>
  </g>
</svg>
